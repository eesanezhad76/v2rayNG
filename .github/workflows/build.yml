name: Build APK
# Keep the audited Albion fixes branch on the same full build and regression gates.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - albion-radar
      - albion-decoder-lab
      - albion-decoder-radar-rebuild
      - albion-integrity-autosave
      - albion-pattern-mining
      - albion-radar-phase1-remediation
      - albion-zone-forensics
      - albion-safe-integration-2026-11-05
      - albion-safe-fixes-2026-11-05
      - albion-integration-staging-2026-11-05
    # Capture-ingest commits update derived evidence only. They must not queue
    # redundant APK builds; source, tests, decoder and workflow changes still do.
    paths-ignore:
      - 'research/inbox/**'
      - 'research/database/**'
      - 'research/analysis/**'
      - 'research/pcap-analyzer/**'
      - 'research/tools/**'
      - 'research/tests/**'
      - '.github/workflows/albion-capture-ingest.yml'
      - 'research/**/*.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Latest source commit wins. Cancel a stale build rather than leaving the
  # newest APK build queued behind a hung gomobile/Go dependency compilation.
  # Keep the dedicated safe-integration validation run alive while follow-up commits queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/albion-safe-integration-2026-11-05' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Generate runtime mobile TypeID dictionary
      run: python3 research/tools/generate_mobile_type_dictionary.py

    - name: Generate historical Albion knowledge seed
      run: python3 research/tools/generate_historical_knowledge_seed.py

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Checkout passive-tap AndroidLibXrayLite
      if: (github.ref == 'refs/heads/albion-radar' || github.ref == 'refs/heads/albion-decoder-lab' || github.ref == 'refs/heads/albion-decoder-radar-rebuild' || github.ref == 'refs/heads/albion-integrity-autosave' || (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05')))
      run: |
        git -C AndroidLibXrayLite remote set-url origin https://github.com/eesanezhad76/AndroidLibXrayLite.git
        git -C AndroidLibXrayLite fetch --depth=1 origin albion-passive-tap
        git -C AndroidLibXrayLite checkout --detach FETCH_HEAD

    - name: Setup Go for passive-tap library
      if: (github.ref == 'refs/heads/albion-radar' || github.ref == 'refs/heads/albion-decoder-lab' || github.ref == 'refs/heads/albion-decoder-radar-rebuild' || github.ref == 'refs/heads/albion-integrity-autosave' || (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05')))
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache: true
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - name: Build passive-tap libv2ray AAR
      if: (github.ref == 'refs/heads/albion-radar' || github.ref == 'refs/heads/albion-decoder-lab' || github.ref == 'refs/heads/albion-decoder-radar-rebuild' || github.ref == 'refs/heads/albion-integrity-autosave' || (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05')))
      timeout-minutes: 25
      working-directory: AndroidLibXrayLite
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        set -euo pipefail
        export PATH="$PATH:$(go env GOPATH)/bin"
        if ! command -v gomobile >/dev/null 2>&1; then
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
        fi
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        mkdir -p ../V2rayNG/app/libs
        gomobile init
        # gomobile's Android staging modules depend on a tidied root module graph.
        go mod tidy
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../V2rayNG/app/libs/libv2ray.aar ./

    - name: Test passive-tap tun package
      if: success() && (github.ref == 'refs/heads/albion-radar' || github.ref == 'refs/heads/albion-decoder-lab' || github.ref == 'refs/heads/albion-decoder-radar-rebuild' || github.ref == 'refs/heads/albion-integrity-autosave' || (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05')))
      working-directory: AndroidLibXrayLite
      run: go test github.com/xtls/xray-core/proxy/tun

    - name: Fetch AndroidLibXrayLite tag
      if: (github.ref != 'refs/heads/albion-radar' && github.ref != 'refs/heads/albion-decoder-lab' && github.ref != 'refs/heads/albion-decoder-radar-rebuild' && github.ref != 'refs/heads/albion-integrity-autosave' && github.ref != 'refs/heads/albion-pattern-mining' && github.ref != 'refs/heads/albion-radar-phase1-remediation' && github.ref != 'refs/heads/albion-zone-forensics' && (github.ref != 'refs/heads/albion-safe-integration-2026-11-05' && github.ref != 'refs/heads/albion-safe-fixes-2026-11-05' && github.ref != 'refs/heads/albion-integration-staging-2026-11-05'))
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      if: (github.ref != 'refs/heads/albion-radar' && github.ref != 'refs/heads/albion-decoder-lab' && github.ref != 'refs/heads/albion-decoder-radar-rebuild' && github.ref != 'refs/heads/albion-integrity-autosave' && github.ref != 'refs/heads/albion-pattern-mining' && github.ref != 'refs/heads/albion-radar-phase1-remediation' && github.ref != 'refs/heads/albion-zone-forensics' && (github.ref != 'refs/heads/albion-safe-integration-2026-11-05' && github.ref != 'refs/heads/albion-safe-fixes-2026-11-05' && github.ref != 'refs/heads/albion-integration-staging-2026-11-05'))
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Skip release keystore for debug radar builds
      if: false
      run: echo "Debug radar APK does not require release signing secrets"

    - name: Build signed isolated radar APK
      if: (github.ref == 'refs/heads/albion-radar' || github.ref == 'refs/heads/albion-decoder-lab' || github.ref == 'refs/heads/albion-decoder-radar-rebuild' || github.ref == 'refs/heads/albion-integrity-autosave' || (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05')))
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew testPlaystoreDebugUnitTest
        ./gradlew assemblePlaystoreDebug

    - name: Build signed APK
      if: (github.ref != 'refs/heads/albion-radar' && github.ref != 'refs/heads/albion-decoder-lab' && github.ref != 'refs/heads/albion-decoder-radar-rebuild' && github.ref != 'refs/heads/albion-integrity-autosave' && github.ref != 'refs/heads/albion-pattern-mining' && github.ref != 'refs/heads/albion-radar-phase1-remediation' && github.ref != 'refs/heads/albion-zone-forensics' && (github.ref != 'refs/heads/albion-safe-integration-2026-11-05' && github.ref != 'refs/heads/albion-safe-fixes-2026-11-05' && github.ref != 'refs/heads/albion-integration-staging-2026-11-05'))
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
    
    - name: Verify all debug APKs and generate SHA-256 manifest
      if: success() && (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      shell: bash
      run: |
        set -euo pipefail
        APK_DIR="V2rayNG/app/build/outputs/apk/playstore/debug"
        REPORT_DIR="V2rayNG/app/build/reports/albion"
        mkdir -p "$REPORT_DIR"
        mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
        if [[ "${#APKS[@]}" -ne 5 ]]; then
          printf 'Expected 5 APKs (4 ABI splits + universal), found %s\\n' "${#APKS[@]}"
          printf '%s\\n' "${APKS[@]}"
          exit 1
        fi
        : > "$REPORT_DIR/apk-signature-verification.txt"
        : > "$REPORT_DIR/apk-sha256.txt"
        for APK in "${APKS[@]}"; do
          echo "VERIFY: $APK" | tee -a "$REPORT_DIR/apk-signature-verification.txt"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee -a "$REPORT_DIR/apk-signature-verification.txt"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          grep -F "package: name='com.v2ray.ang.radar'" <<< "$BADGING" >/dev/null
          grep -F "sdkVersion:'24'" <<< "$BADGING" >/dev/null
          grep -F "targetSdkVersion:'35'" <<< "$BADGING" >/dev/null
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          sha256sum "$APK" >> "$REPORT_DIR/apk-sha256.txt"
        done
        cat "$REPORT_DIR/apk-sha256.txt"

    - name: Install universal APK on Android 15 emulator
      if: success() && (github.ref == 'refs/heads/albion-radar-phase1-remediation' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: |
          test -s "V2rayNG/app/build/outputs/apk/playstore/debug/v2rayNG_2.3.14-radar_universal.apk"
          timeout 300s adb install --no-streaming -r "V2rayNG/app/build/outputs/apk/playstore/debug/v2rayNG_2.3.14-radar_universal.apk"
          timeout 30s adb shell pm path com.v2ray.ang.radar
          timeout 30s adb shell monkey -p com.v2ray.ang.radar -c android.intent.category.LAUNCHER 1

    - name: Run offline PCAP replay and audit
      if: success() && (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      shell: bash
      run: |
        set -euo pipefail
        V2rayNG/gradlew -p research/pcap-analyzer auditInbox --no-daemon
        python3 research/tools/analyze_spatial_alignment.py

    - name: Test Python analysis, marker FIFO, and readiness logic
      if: always() && (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      shell: bash
      run: |
        echo "ALBION_PYTHON_TESTS_STATUS=FAIL" >> "$GITHUB_ENV"
        python3 -m unittest discover -s research/tests -p 'test_*.py' -v
        python3 research/tools/validate_runtime_knowledge_assets.py
        echo "ALBION_PYTHON_TESTS_STATUS=PASS" >> "$GITHUB_ENV"

    - name: Generate Albion readiness report
      if: always() && (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      run: python3 research/tools/generate_readiness_report.py

    - name: Upload Albion readiness report
      if: always() && (github.ref == 'refs/heads/albion-pattern-mining' || github.ref == 'refs/heads/albion-radar-phase1-remediation' || github.ref == 'refs/heads/albion-zone-forensics' || (github.ref == 'refs/heads/albion-safe-integration-2026-11-05' || github.ref == 'refs/heads/albion-safe-fixes-2026-11-05' || github.ref == 'refs/heads/albion-integration-staging-2026-11-05'))
      uses: actions/upload-artifact@v7
      with:
        name: albion-readiness-report
        path: |
          research/analysis/albion-readiness-report.md
          research/analysis/albion-readiness-report.json
        if-no-files-found: warn
    - name: Upload unit test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-diagnostics
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/reports/tests/testPlaystoreDebugUnitTest/
          ${{ github.workspace }}/V2rayNG/app/build/test-results/testPlaystoreDebugUnitTest/
        if-no-files-found: warn

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*_x86.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*universal*.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: x86_64-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*x86_64*.apk

    - name: Upload APK verification and SHA-256 manifest
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: apk-verification
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/reports/albion/apk-signature-verification.txt
          ${{ github.workspace }}/V2rayNG/app/build/reports/albion/apk-sha256.txt
        if-no-files-found: warn

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
