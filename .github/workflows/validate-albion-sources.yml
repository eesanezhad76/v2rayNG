name: Validate Albion sources (no APK)

on:
  push:
    branches:
      - albion-reliability-ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: albion-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> ${GITHUB_ENV}

      - name: Checkout passive-tap Android library branch
        run: |
          git -C AndroidLibXrayLite remote set-url origin https://github.com/eesanezhad76/AndroidLibXrayLite.git
          git -C AndroidLibXrayLite fetch --depth=1 origin albion-passive-tap
          git -C AndroidLibXrayLite checkout --detach FETCH_HEAD

      - uses: actions/setup-go@v6
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache: false

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build passive tap AAR dependency
        working-directory: AndroidLibXrayLite
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          mkdir -p ../V2rayNG/app/libs
          gomobile init
          go mod tidy
          go test -race github.com/xtls/xray-core/proxy/tun
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../V2rayNG/app/libs/libv2ray.aar ./

      - name: Compile Kotlin sources only (no APK task)
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:compilePlaystoreDebugKotlin
