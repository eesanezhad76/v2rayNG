name: Temporary signing credential check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-existing-signing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the already-working repository signing secrets
        shell: bash
        env:
          ALBION_KEYSTORE_BASE64: ${{ secrets.ALBION_KEYSTORE_BASE64 }}
          ALBION_KEYSTORE_PASSWORD: ${{ secrets.ALBION_KEYSTORE_PASSWORD }}
          ALBION_KEY_ALIAS: ${{ secrets.ALBION_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          set +x
          fail() { echo "VALIDATION_FAILED_AT=$1"; exit 1; }
          test -n "$ALBION_KEYSTORE_BASE64" || fail MISSING_KEYSTORE_BASE64
          test -n "$ALBION_KEYSTORE_PASSWORD" || fail MISSING_KEYSTORE_PASSWORD
          test -n "$ALBION_KEY_ALIAS" || fail MISSING_KEY_ALIAS
          umask 077
          KS="$RUNNER_TEMP/albion-existing.jks"
          printf '%s' "$ALBION_KEYSTORE_BASE64" | base64 --decode > "$KS" || fail BASE64_DECODE
          test -s "$KS" || fail EMPTY_KEYSTORE
          echo "BASE64_DECODE=PASS"
          keytool -list -keystore "$KS" -storepass "$ALBION_KEYSTORE_PASSWORD" -alias "$ALBION_KEY_ALIAS" >/dev/null 2>&1 || fail STORE_PASSWORD_OR_ALIAS
          echo "STORE_PASSWORD_AND_ALIAS=PASS"
          keytool -importkeystore -srckeystore "$KS" -srcstoretype PKCS12 -srcstorepass "$ALBION_KEYSTORE_PASSWORD" -srcalias "$ALBION_KEY_ALIAS" -srckeypass "$ALBION_KEYSTORE_PASSWORD" -destkeystore "$RUNNER_TEMP/albion-check.p12" -deststoretype PKCS12 -deststorepass "$ALBION_KEYSTORE_PASSWORD" -destkeypass "$ALBION_KEYSTORE_PASSWORD" -noprompt >/dev/null 2>&1 || fail PRIVATE_KEY_ACCESS
          echo "PRIVATE_KEY_ACCESS=PASS"
          echo "EXISTING_REPOSITORY_SIGNING_SECRETS=PASS"
