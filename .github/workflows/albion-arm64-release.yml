name: Albion ARM64 Private APK

on:
  workflow_dispatch:
  push:
    branches:
      - albion-v2rayng-2.2.6-port
    paths:
      - ".github/workflows/albion-arm64-release.yml"
      - "V2rayNG/**"
      - "AndroidLibXrayLite/**"
      - "Xray-core/**"
      - "compile-hevtun.sh"

permissions:
  contents: read

concurrency:
  group: albion-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore and validate private signing key (early preflight)
        shell: bash
        env:
          ALBION_KEYSTORE_BASE64: ${{ secrets.ALBION_KEYSTORE_BASE64 }}
          ALBION_KEYSTORE_PASSWORD: ${{ secrets.ALBION_KEYSTORE_PASSWORD }}
          ALBION_KEY_ALIAS: ${{ secrets.ALBION_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ALBION_KEYSTORE_BASE64" || { echo "Missing secret: ALBION_KEYSTORE_BASE64"; exit 1; }
          test -n "$ALBION_KEYSTORE_PASSWORD" || { echo "Missing secret: ALBION_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ALBION_KEY_ALIAS" || { echo "Missing secret: ALBION_KEY_ALIAS"; exit 1; }
          ALBION_KEY_PASSWORD="$ALBION_KEYSTORE_PASSWORD"
          echo "$ALBION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/albion-release.jks"
          chmod 600 "$RUNNER_TEMP/albion-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/albion-release.jks" -storepass "$ALBION_KEYSTORE_PASSWORD" -alias "$ALBION_KEY_ALIAS" >/dev/null; then
            echo "KEYSTORE_CHECK_FAILED: store password or alias does not match the uploaded keystore."
            exit 1
          fi
          if ! keytool -importkeystore -srckeystore "$RUNNER_TEMP/albion-release.jks" -srcstoretype PKCS12 -srcstorepass "$ALBION_KEYSTORE_PASSWORD" -srcalias "$ALBION_KEY_ALIAS" -srckeypass "$ALBION_KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/albion-key-check.p12" -deststoretype PKCS12 -deststorepass "$ALBION_KEYSTORE_PASSWORD" -destkeypass "$ALBION_KEYSTORE_PASSWORD" -noprompt >/dev/null; then
            echo "PRIVATE_KEY_PASSWORD_CHECK_FAILED: the private-key password does not unlock the alias."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/albion-key-check.p12"
          echo "ALBION_KEYSTORE_PATH=$RUNNER_TEMP/albion-release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$ALBION_KEYSTORE_PASSWORD"
          echo "::add-mask::$ALBION_KEY_PASSWORD"
          echo "Private signing key and private-key password validated."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build HEV TUN native libraries
        run: bash compile-hevtun.sh

      - name: Stage HEV TUN libraries
        run: |
          mkdir -p V2rayNG/app/libs
          cp -a libs/. V2rayNG/app/libs/

      - name: Check out Albion passive-tap Android library
        shell: bash
        run: |
          set -euo pipefail
          git -C AndroidLibXrayLite remote set-url origin https://github.com/eesanezhad76/AndroidLibXrayLite.git
          git -C AndroidLibXrayLite fetch --depth=1 origin albion-passive-tap
          git -C AndroidLibXrayLite checkout --detach FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache: false

      - name: Build passive-tap libv2ray AAR
        working-directory: AndroidLibXrayLite
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          gomobile init
          go mod tidy
          go test github.com/xtls/xray-core/proxy/tun
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../V2rayNG/app/libs/libv2ray.aar ./

      - name: Build private ARM64 APK (not a Play Store upload)
        working-directory: V2rayNG
        shell: bash
        env:
          ALBION_KEYSTORE_PASSWORD: ${{ secrets.ALBION_KEYSTORE_PASSWORD }}
          ALBION_KEY_ALIAS: ${{ secrets.ALBION_KEY_ALIAS }}
          ALBION_KEY_PASSWORD: ${{ secrets.ALBION_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$ALBION_KEYSTORE_PATH"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon clean assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a
          APK="$(find app/build/outputs/apk/playstore/release -name "*arm64-v8a*.apk" -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload private-build APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: albion-arm64-private-apk
          path: V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
