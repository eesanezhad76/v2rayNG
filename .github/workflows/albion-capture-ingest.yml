name: Albion capture ingest
on:
  push:
    branches: [albion-pattern-mining]
    paths:
      - 'research/inbox/**'
      - 'research/tools/**'
      - 'research/tests/**'
      - '.github/workflows/albion-capture-ingest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: albion-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: albion-pattern-mining
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forensic ZIP inventory and test-note extraction
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/forensic_zip_audit.py
      - name: Run ingest and validation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          zips=(research/inbox/*.zip research/inbox/**/*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            python research/tools/ingest_capture.py "${zips[@]}"
          else
            echo "No capture ZIP in inbox; validating ingest code."
          fi
          python -m unittest discover -s research/tests -p 'test_*.py' -v
      - name: Commit derived evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/database research/analysis
          if git diff --cached --quiet; then echo "No derived changes"; exit 0; fi
          git commit -m "data(albion): ingest uploaded capture evidence"
          git push origin albion-pattern-mining
