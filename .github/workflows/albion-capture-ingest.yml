name: Albion capture ingest
on:
  push:
    branches: [albion-pattern-mining]
    paths:
      - 'research/inbox/**'
      - 'research/tools/**'
      - 'research/tests/**'
      - 'research/pcap-analyzer/**'
      - 'V2rayNG/app/src/main/java/com/v2ray/ang/albion/**'
      - '.github/workflows/albion-capture-ingest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: albion-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: albion-pattern-mining
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and validate uploaded split 7z archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(research/inbox/archiveNew.7z.t0.[0-9][0-9][0-9])
          if [[ "${#parts[@]}" -ne 45 ]]; then
            echo "Expected 45 archiveNew split parts, found ${#parts[@]}"
            printf '%s\\n' "${parts[@]}"
            exit 1
          fi
          tmp="$RUNNER_TEMP/albion-archive"
          mkdir -p "$tmp/volumes" research/inbox/archiveNew-extracted
          for i in $(seq 1 45); do
            printf -v n "%03d" "$i"
            source="research/inbox/archiveNew.7z.t0.$n"
            test -s "$source"
            cp "$source" "$tmp/volumes/archiveNew.7z.$n"
          done
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          if 7z t -bd -y "$tmp/volumes/archiveNew.7z.001"; then
            7z x -bd -y "$tmp/volumes/archiveNew.7z.001" "-o$PWD/research/inbox/archiveNew-extracted"
            echo "ARCHIVE_MODE=multi-volume"
          else
            cat "${parts[@]}" > "$tmp/archiveNew-concatenated.7z"
            7z t -bd -y "$tmp/archiveNew-concatenated.7z"
            7z x -bd -y "$tmp/archiveNew-concatenated.7z" "-o$PWD/research/inbox/archiveNew-extracted"
            echo "ARCHIVE_MODE=concatenated-split"
          fi
          find research/inbox/archiveNew-extracted -type f -printf '%P %s bytes\\n' | sort
      - name: Package extracted test captures for the existing forensic pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find research/inbox/archiveNew-extracted -type f -name '*.pcap' -print -quit)"
          test -n "$(find research/inbox/archiveNew-extracted -type f -name '*.jsonl' -print -quit)"
          (cd research/inbox/archiveNew-extracted && zip -0 -q -r ../archiveNew-extracted.zip .)
          unzip -l research/inbox/archiveNew-extracted.zip
      - name: Forensic ZIP inventory and test-note extraction
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/forensic_zip_audit.py
      - name: Run ingest and validation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          zips=(research/inbox/*.zip research/inbox/**/*.zip)
          if [[ "${#zips[@]}" -eq 0 ]]; then
            echo "No ZIP archives found after split-archive extraction"
            exit 1
          fi
          python research/tools/ingest_capture.py --refresh-existing "${zips[@]}"
          python research/tools/ingest_knowledge_bundle.py --rebuild "${zips[@]}"
          python research/tools/generate_mobile_type_dictionary.py
          python research/tools/generate_historical_knowledge_seed.py
          python research/tools/validate_runtime_knowledge_assets.py
          python -m unittest discover -s research/tests -p 'test_*.py' -v
          chmod +x V2rayNG/gradlew
          V2rayNG/gradlew -p research/pcap-analyzer auditInbox --no-daemon
          python research/tools/analyze_spatial_alignment.py
          python research/tools/build_complete_database_index.py
          python research/tools/classify_entity_catalog.py
      - name: Commit derived evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/database research/analysis V2rayNG/app/src/main/assets/albion-static-catalog.json V2rayNG/app/src/main/assets/albion-historical-*.json V2rayNG/app/src/main/assets/albion-mobile-type-dictionary.json
          # Preserve oversized generated evidence losslessly as checksum-verified chunks.
          python research/tools/split_large_outputs.py --max-mib 45 --threshold-mib 50
          git add research/analysis/derived-shards research/analysis/derived-output-shards-manifest.json
          # Keep only the original oversized containers out of Git; their exact bytes are in the shards.
          while IFS= read -r -d '' oversized; do
            echo "Original oversized container represented by verified shards: $oversized ($(du -h "$oversized" | cut -f1))"
            git reset -q -- "$oversized"
          done < <(find research/analysis research/database -type f -size +50M -print0)
          if git diff --cached --quiet; then echo "No derived changes"; exit 0; fi
          git commit -m "data(albion): ingest uploaded capture evidence"
          # A user may push while this analysis is running. Rebase our derived
          # evidence commit onto the newer branch tip and retry; never force-push.
          for attempt in 1 2 3; do
            if git push origin albion-pattern-mining; then
              exit 0
            fi
            git fetch origin albion-pattern-mining
            git rebase origin/albion-pattern-mining
          done
          echo "Unable to fast-forward derived evidence after three safe retries."
          exit 1
